
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run TypeScript compiler
        run: pnpm exec tsc --noEmit

      - name: UI to API contract check
        run: pnpm contract

      - name: Run unit tests
        run: pnpm test

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting on changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.scss' '*.md' '*.yaml' '*.yml' '*.html')

          if [[ -z "$FILES" ]]; then
            echo "No supported files changed. Skipping Prettier."
            exit 0
          fi

          echo "$FILES" | while IFS= read -r file; do
            pnpm exec prettier --check "$file" || exit 1
          done
